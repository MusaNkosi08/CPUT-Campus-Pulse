<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Campus Pulse // Report</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="/styles.css"></head>
<body data-page="report"><div class="scanlines"></div><main class="report-page"><a class="logo" href="/index.html"><span>✦</span> CAMPUS<span class="logo-dim">PULSE</span></a><section class="report-panel glass-panel reveal"><p class="kicker cyan">NEW SIGNAL // 01—03</p><h1>What's<br><span>happening?</span></h1><p class="hero-lede">Keep it clear. Keep it useful. The campus is listening.</p><form id="report-form"><label>CATEGORY<select name="category" required><option value="">Choose a category</option><option value="water">Water</option><option value="power">Power</option><option value="access">Access</option><option value="teaching">Teaching</option><option value="safety">Safety</option><option value="other">Other</option></select></label><label>SHORT DESCRIPTION<textarea name="description" required minlength="5" placeholder="e.g. Projector in room 2.14 is not turning on"></textarea></label><p class="pin-label">PIN LOCATION <small>Click the map to move your signal</small></p><div id="report-map"></div><input type="hidden" name="latitude" value="-33.9309"><input type="hidden" name="longitude" value="18.4258"><button class="button button-cyan form-submit">PUBLISH SIGNAL <b>↗</b></button></form><p id="form-error" class="form-error" role="alert"></p></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/app.js"></script></body></html>
